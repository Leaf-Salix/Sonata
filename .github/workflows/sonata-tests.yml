name: Sonata Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src/sonata/ --output-format=github

  sonata-unit-tests:
    name: Sonata Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pypto wheel
        uses: actions/cache@v4
        with:
          path: ~/pypto-wheels
          key: pypto-wheel-${{ runner.os }}-${{ hashFiles('upstream/pypto/pyproject.toml') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-xdist
          if [ -f upstream/pypto/pyproject.toml ]; then
            WHEEL=$(ls ~/pypto-wheels/pypto-*.whl 2>/dev/null | head -1)
            if [ -n "$WHEEL" ]; then
              echo "Using cached wheel: $WHEEL"
              pip install "$WHEEL"
            else
              echo "Building pypto wheel..."
              pip wheel upstream/pypto/ --no-deps -w ~/pypto-wheels
              pip install ~/pypto-wheels/pypto-*.whl
            fi
          fi

      - name: Install GoogleTest (for sonata_hook C++ fail-open harness)
        run: |
          # Ubuntu's libgtest-dev ships headers + CMake source only, no
          # prebuilt .a — build once and drop the libs where
          # tests/sonata/tools/Makefile's GTEST_SEARCH_PATHS looks for them.
          sudo apt-get update
          sudo apt-get install -y libgtest-dev
          cd /usr/src/googletest
          sudo cmake -DCMAKE_BUILD_TYPE=Release .
          sudo make
          sudo cp lib/*.a /usr/local/lib/

      - name: Run sonata unit tests
        env:
          PYTHONPATH: src
        run: |
          python -m pytest tests/sonata -q --tb=short

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: sonata-unit-tests

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pypto wheel
        uses: actions/cache@v4
        with:
          path: ~/pypto-wheels
          key: pypto-wheel-${{ runner.os }}-${{ hashFiles('upstream/pypto/pyproject.toml') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f upstream/pypto/pyproject.toml ]; then
            WHEEL=$(ls ~/pypto-wheels/pypto-*.whl 2>/dev/null | head -1)
            if [ -n "$WHEEL" ]; then
              echo "Using cached wheel: $WHEEL"
              pip install "$WHEEL"
            else
              echo "Building pypto wheel..."
              pip wheel upstream/pypto/ --no-deps -w ~/pypto-wheels
              pip install ~/pypto-wheels/pypto-*.whl
            fi
          fi

      - name: Run pypto_cases tests
        env:
          PYTHONPATH: src:upstream/pypto/python
        run: |
          python -m pytest tests/pypto_cases -q --tb=short || echo "Integration tests require pypto C++ build"

  test-summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [sonata-unit-tests, integration-tests]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "Unit tests: ${{ needs.sonata-unit-tests.result }}"
          echo "Integration: ${{ needs.integration-tests.result }}"
          if [ "${{ needs.sonata-unit-tests.result }}" != "success" ]; then
            exit 1
          fi
