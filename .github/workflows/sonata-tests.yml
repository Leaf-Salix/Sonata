name: Sonata Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonata-unit-tests:
    name: Sonata Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-xdist
          if [ -f upstream/pypto/pyproject.toml ]; then
            pip install upstream/pypto/ 2>/dev/null || echo "pypto C++ build skipped"
          fi

      - name: Run sonata unit tests
        env:
          PYTHONPATH: src
        run: |
          python -m pytest tests/sonata -q --tb=short

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: sonata-unit-tests

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install upstream/pypto/ 2>/dev/null || echo "pypto C++ build skipped"

      - name: Run pypto_cases tests
        env:
          PYTHONPATH: src:upstream/pypto/python
        run: |
          python -m pytest tests/pypto_cases -q --tb=short || echo "Integration tests require pypto C++ build"

  test-summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [sonata-unit-tests, integration-tests]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "Unit tests: ${{ needs.sonata-unit-tests.result }}"
          echo "Integration: ${{ needs.integration-tests.result }}"
          if [ "${{ needs.sonata-unit-tests.result }}" != "success" ]; then
            exit 1
          fi
